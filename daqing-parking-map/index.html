<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://www.gstatic.com/charts/loader.js"></script><script src="./plans.js"></script><script src="./parking-map.js"></script>
<title>大清城龍｜車位銷售圖</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;color:#222;background:#fff}.layout{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.sidebar{padding:26px 18px;border-right:1px solid #ddd;background:#fff;display:flex;flex-direction:column;gap:20px}.brand{font-size:19px;font-weight:700;margin:0 0 15px}.project-list{display:grid;gap:8px}.project-toggle,.floor-button,.tool-toggle,.btn{font:inherit;border:0;background:transparent;text-align:left;cursor:pointer}.project-toggle{width:100%;padding:8px 0;font-size:15px;font-weight:650;color:#303030}.project-toggle:after{content:'⌄';float:right;color:#999}.project-toggle.closed:after{content:'›'}.floors{display:grid;gap:4px;padding-left:12px}.floors.collapsed{display:none}.floor-button{padding:3px 0;color:#c7c7c7}.floor-button.active{color:#f44343;font-weight:700}.tools{margin-top:auto;border-top:1px solid #eee;padding-top:14px}.tool-toggle{width:100%;padding:6px 0;font-weight:650}.tool-content{display:none;padding-top:12px}.tool-content.open{display:block}.tool-group{margin-bottom:15px}.tool-group label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.tool-group small,.note{display:block;color:#777;font-size:11px;line-height:1.5;margin-top:5px}input[type=file]{width:100%;font-size:11px}input[type=text]{width:100%;border:1px solid #ddd;border-radius:4px;padding:7px}.btn{padding:7px 9px;border-radius:4px;font-size:12px;background:#f1f2f3;margin:2px 2px 2px 0}.btn.primary{background:#e94f58;color:white}.btn-row{display:flex;gap:5px;align-items:center}.btn-row input{min-width:0}.status{font-size:11px;color:#555;line-height:1.5;margin-top:6px}.legend{font-size:11px;color:#555;line-height:1.8}.swatch{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:5px;background:#ff9a9a}.swatch.moto{background:#ffdcae}.stage{min-width:0;min-height:100vh;position:relative}.viewport{width:100%;height:100vh;min-height:500px;position:relative;overflow:auto;background:white}.pdf-preview{position:absolute;inset:0;width:100%;height:100%;border:0;background:white}.empty{display:none}.canvas-wrap{position:relative;margin:0 auto;line-height:0;display:none}.canvas-wrap canvas{display:block;max-width:none}.overlay{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}.top-tools{position:absolute;right:18px;top:12px;z-index:4;display:flex;gap:6px}.top-tools .btn{opacity:.9}.print-title{display:none}.screen-floor-label{position:absolute;left:14px;top:12px;z-index:4;font-size:24px;font-weight:700;color:#000;background:rgba(255,255,255,.88);padding:4px 11px;border-radius:3px}
@media(max-width:700px){.layout{grid-template-columns:180px minmax(0,1fr)}.sidebar{padding:18px 12px}.viewport{height:90vh;min-height:400px}}
@media print{@page{size:A4 landscape;margin:7mm}.layout{display:block;min-height:0}.sidebar,.top-tools,.screen-floor-label{display:none!important}.stage,.viewport{height:auto;min-height:0;overflow:visible}.print-title{display:block;font-size:14pt;font-weight:bold;margin:0 0 3mm}.pdf-preview{position:static;width:100%;height:175mm}.canvas-wrap{display:block!important;width:auto!important;height:auto!important;max-width:100%;margin:0 auto}.canvas-wrap canvas{width:auto!important;height:auto!important;max-width:100%;max-height:175mm}.overlay{width:100%!important;height:100%!important}}
</style></head>
<body><main class="layout"><aside class="sidebar">
<div><h1 class="brand">大清城龍</h1><div id="project-list" class="project-list"></div></div>
<div class="tools"><button id="tools-toggle" class="tool-toggle">工具　＋</button><div id="tool-content" class="tool-content">
<div class="tool-group"><label>銷售資料</label><button id="sync" class="btn">立即更新</button><input id="csv" type="file" accept=".csv,text/csv"><small>B 欄日期或 1 表示已訂；U/V 是汽車車位及樓層，X 是機車位。網頁開啟時同步，每 5 分鐘更新。</small><div id="status" class="status">正在連接銷售資料…</div></div>
<div class="tool-group"><label>已售車位</label><div class="legend"><span class="swatch"></span>汽車　<span class="swatch moto"></span>機車（編號含 X）</div><div id="chips" class="project-list"></div></div>
<button id="print" class="btn primary">列印 / 存成 PDF</button><p class="note">已售汽車粉紅、已售機車 #ffdcae；姓名僅滑鼠移到已售車位時顯示。</p>
</div></div></aside><section class="stage"><div id="screen-floor-label" class="screen-floor-label">B1</div><h2 id="print-title" class="print-title">大清城龍｜B1 車位銷售圖</h2><div class="top-tools"><button id="print-top" class="btn">列印</button></div><div class="viewport" id="viewport"><iframe id="pdf-preview" class="pdf-preview" title="車位圖" src="./b1-parking-plan.pdf"></iframe><div class="empty" id="empty"></div><div class="canvas-wrap" id="wrap"><canvas id="base"></canvas><canvas id="overlay" class="overlay"></canvas></div></div></section></main>
<script>
const $=s=>document.querySelector(s),base=$('#base'),ctx=base.getContext('2d'),over=$('#overlay'),ox=over.getContext('2d');let sales={cars:{},motos:{}},currentProject='大清城龍',currentFloor='B1';
let projects=['\u5927\u6e05\u57ce\u9f8d'],expanded=new Set(['大清城龍']);
function renderProjects(){const box=$('#project-list');box.innerHTML='';projects.forEach((name,i)=>{const item=document.createElement('div'),toggle=document.createElement('button'),floors=document.createElement('div');toggle.className='project-toggle'+(expanded.has(name)?'':' closed');toggle.textContent=name;toggle.onclick=()=>{expanded.has(name)?expanded.delete(name):expanded.add(name);renderProjects()};floors.className='floors'+(expanded.has(name)?'':' collapsed');['B1','B2'].forEach(f=>{const b=document.createElement('button');b.className='floor-button'+(name===currentProject&&f===currentFloor?' active':'');b.textContent=f;b.onclick=()=>selectFloor(name,f);floors.appendChild(b)});item.append(toggle,floors);box.appendChild(item)})}
function selectFloor(project,floor){currentProject=project;currentFloor=floor;$('#screen-floor-label').textContent=floor;$('#print-title').textContent=project+'｜'+floor+' 車位銷售圖';$('#wrap').style.display='none';$('#pdf-preview').style.display='none';planKey='';if(project==='大清城龍'){loadEmbeddedPlan(floor);$('#status').textContent='正在載入 '+floor+' 車位圖…'}else{$('#pdf-preview').src='about:blank';$('#pdf-preview').style.display='block';$('#status').textContent='此建案尚未設定圖面對位。'}renderProjects()}
function loadEmbeddedPlan(floor){const image=new Image();image.onload=()=>{base.width=image.naturalWidth;base.height=image.naturalHeight;const t=floor==='B1'?{s:1.003,dx:94,dy:-16}:{s:1,dx:0,dy:0};ctx.setTransform(t.s,0,0,t.s,t.dx,t.dy);ctx.drawImage(image,0,0);ctx.setTransform(1,0,0,1,0,0);readyPlan()};image.onerror=()=>{$('#status').textContent='Base plan failed to load.';$('#pdf-preview').src=floor==='B1'?'./B1f???(???).pdf':'./B2f???(???).pdf';$('#pdf-preview').style.display='block'};image.src=window.EMBEDDED_PLAN_IMAGES[floor]}
renderProjects();
$('#tools-toggle').onclick=()=>{const c=$('#tool-content');c.classList.toggle('open');$('#tools-toggle').textContent=c.classList.contains('open')?'工具　－':'工具　＋'};
$('#showB1')?.addEventListener('click',()=>selectFloor('大清城龍','B1'));
function readyPlan(){$('#pdf-preview').style.display='none';$('#wrap').style.display='block';fit();over.width=base.width;over.height=base.height;draw()}
function fit(){let max=Math.min($('#viewport').clientWidth-24,1500),ratio=Math.min(1,max/base.width);$('#wrap').style.width=(base.width*ratio)+'px';$('#wrap').style.height=(base.height*ratio)+'px';base.style.width='100%';base.style.height='100%';over.style.width='100%';over.style.height='100%'}window.onresize=()=>{if($('#wrap').style.display==='block')fit()};
function parseCSV(t){let rows=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'&&q&&t[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v.trim());v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v.trim());if(row.some(Boolean))rows.push(row);row=[];v=''}else v+=c}row.push(v.trim());if(row.some(Boolean))rows.push(row);return rows}
function importRows(rows){
 if(rows.length<2){$('#status').textContent='\u8cc7\u6599\u4e0d\u8db3\uff0c\u8acb\u78ba\u8a8d\u8868\u683c\u6709\u6a19\u984c\u5217\u8207\u8cc7\u6599\u5217\u3002';return}
 const ia=0,ib=1,id=3,iu=20,iv=21,ix=23;
 const next={cars:{},motos:{}},negative=/^(false|0|n|no|\u53d6\u6d88|\u9000\u8a02|\u672a\u4e0b\u8a02|\u5426|\u672a\u6210\u4ea4)$/;let booked=0;
 // Sheet rows 102–109 (starting at the 「戶數」 row, 8 rows) are the owner's summary area: skip them. Rows below are real bookings.
 const summaryStart=rows.findIndex(r=>String(r[ia]??'').trim()==='戶數'),SUMMARY_ROWS=8;
 for(const [ri,r] of rows.entries()){
  if(ri===0)continue;
  if(summaryStart>0&&ri>=summaryStart&&ri<summaryStart+SUMMARY_ROWS)continue;
  // Google Visualization includes a numeric column-heading row in this sheet; skip it before treating U/X values as assignments.
  if(String(r[0]??'').trim()==='1'&&String(r[20]??'').trim()==='21'&&String(r[21]??'').trim()==='22')continue;
  const b=String(r[ib]??'').trim().toLowerCase(),c=String(r[2]??'').trim().toLowerCase(),isBooked=(b&&!negative.test(b))||c==='1';
  if(isBooked)booked++;
  const buyer=String(r[id]??'').trim(),household=String(r[ia]??'').trim();  const rawCar=String(r[iu]??'').trim(),carDigits=rawCar.replace(/^0+(?=\d)/,''),sheetFloor=(summaryStart>0&&ri>=summaryStart+SUMMARY_ROWS?'':String(r[iv]??'')).trim().toUpperCase().replace(/\s+/g,'');
  const floor=/^B[12]$/.test(sheetFloor)?sheetFloor:(AUTO_BOXES.car.B1[carDigits]?'B1':AUTO_BOXES.car.B2[carDigits]?'B2':'');
  const hasCar=/^\d+$/.test(carDigits)&&Number(carDigits)>=1&&Number(carDigits)<=110&&/^B[12]$/.test(floor);
  const rawMoto=String(r[ix]??'').trim(),motoDigits=rawMoto.replace(/^0+(?=\d)/,'');
  const hasMoto=/^\d+$/.test(motoDigits)&&Number(motoDigits)>=1&&Number(motoDigits)<=110;
  // Any assigned car or motorcycle number counts as sold/reserved, even without a booking marker.
  if(hasCar){const key=`${floor}-${carDigits}`;next.cars[key]={floor,no:carDigits,buyer,household}}
  if(hasMoto){const number=motoDigits,motoFloor=AUTO_BOXES.moto.B1[number]?'B1':AUTO_BOXES.moto.B2[number]?'B2':'';const key=`${motoFloor||'Unmapped'}-X${number}`;next.motos[key]={floor:motoFloor,no:number,buyer,household}}
 }
 sales=next;
 const missingCars=Object.values(sales.cars).filter(s=>!AUTO_BOXES.car[s.floor]?.[s.no]).length,missingMotos=Object.values(sales.motos).filter(s=>!AUTO_BOXES.moto[s.floor]?.[s.no]).length;
 $('#status').textContent=`\u8eca\u4f4d\u5df2\u586b\u8272\uff08\u542b\u9810\u5b9a\uff09\uff1a\u6c7d\u8eca ${Object.keys(sales.cars).length} \u683c\u3001\u6a5f\u8eca ${Object.keys(sales.motos).length} \u683c\uff1b\u4e0b\u8a02\u6a19\u8a18 ${booked} \u7b46\uff1b\u5716\u9762\u672a\u5c0d\u4f4d ${missingCars+missingMotos} \u683c\u3002`;
 renderChips();draw()
}
$('#csv').onchange=async e=>{const f=e.target.files[0];if(f)importRows(parseCSV((await f.text()).replace(/^\uFEFF/,'')))};
function syncSheet(){if(!window.google?.charts){$('#status').textContent='Google 試算表元件載入失敗；可下載 CSV 匯入。';return}$('#status').textContent='正在同步試算表…';google.charts.load('current',{packages:['table']});google.charts.setOnLoadCallback(()=>{const u='https://docs.google.com/spreadsheets/d/1kM5VPwY3j8aKKm0MQnu3PYMsK-1GKiONdVE3PTdv8lU/gviz/tq?sheet='+encodeURIComponent('1.客戶總資料表'),q=new google.visualization.Query(u);q.setQuery('select *');q.send(r=>{if(r.isError()){$('#status').textContent='讀取失敗。請確認試算表允許知道連結者檢視；也可匯入 CSV。';return}const t=r.getDataTable(),rows=[Array.from({length:t.getNumberOfColumns()},(_,c)=>t.getColumnLabel(c))];for(let i=0;i<t.getNumberOfRows();i++)rows.push(Array.from({length:t.getNumberOfColumns()},(_,c)=>t.getValue(i,c)??t.getFormattedValue(i,c)??''));importRows(rows);$('#status').textContent+=' 網頁會每 5 分鐘自動更新。'})})}
$('#sync').onclick=syncSheet;window.addEventListener('load',()=>{setTimeout(syncSheet,700);setInterval(syncSheet,300000)});
function renderChips(){const list=[...Object.entries(sales.cars).map(([id,s])=>({id,s,moto:false})),...Object.entries(sales.motos).map(([id,s])=>({id,s,moto:true}))].sort((a,b)=>a.id.localeCompare(b.id));$('#chips').innerHTML=list.map(({id,s,moto})=>`<span class="btn" style="background:${moto?'#ffdcae':'#ffb3b3'}" title="${s.buyer||''}">${id}</span>`).join('')}
function draw(){if(!over.width||!over.height)return;ox.clearRect(0,0,over.width,over.height);const boxes=[],transformBox=b=>currentFloor==='B1'?[b[0]*1.003+94,b[1]*1.003-16,b[2]*1.003,b[3]*1.003]:b;for(const [id,s] of Object.entries(sales.cars)){if(s.floor!==currentFloor)continue;const b=AUTO_BOXES.car[s.floor][s.no];if(b)boxes.push({id,s,b:transformBox(b),moto:false})}for(const [id,s] of Object.entries(sales.motos)){if(s.floor!==currentFloor)continue;const b=AUTO_BOXES.moto[s.floor][s.no];if(b)boxes.push({id,s,b:transformBox(b),moto:true})}for(const {id,s,b,moto} of boxes){const [x,y,w,h]=b,margin=moto?1.5:3;ox.fillStyle=moto?'rgba(255,220,174,.72)':'rgba(255,115,128,.48)';ox.fillRect(x+margin,y+margin,w-margin*2,h-margin*2);ox.strokeStyle=moto?'#ca994f':'#df4256';ox.lineWidth=Math.max(1.5,base.width/1100);ox.strokeRect(x+margin,y+margin,w-margin*2,h-margin*2)}over._parkingBoxes=boxes}
over.onpointermove=e=>{if(!base.width)return;const r=over.getBoundingClientRect(),k=base.width/r.width,x=(e.clientX-r.left)*k,y=(e.clientY-r.top)*k,hit=(over._parkingBoxes||[]).find(({b})=>x>=b[0]&&x<=b[0]+b[2]&&y>=b[1]&&y<=b[1]+b[3]);over.title=hit?`${hit.moto?'機':'汽'} ${hit.s.no} | ${hit.s.household||''} | ${hit.s.buyer||''}`:''};
$('#print').onclick=$('#print-top').onclick=()=>window.print();
selectFloor('大清城龍','B1');
</script></body></html>
